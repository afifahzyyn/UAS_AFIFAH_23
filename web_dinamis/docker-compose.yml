services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbuasfika
      MARIADB_USER: uas_afifah_32
      MARIADB_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/init.sql:/docker-entrypoint-initdb.d/init.sql
