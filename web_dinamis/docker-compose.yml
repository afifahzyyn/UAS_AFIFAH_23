  container-dinamis:
    image: ${DOCKERHUB_USERNAME}/uas_webdinamis_32:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_HOST: db-webdinamis
      DB_USER: uas_afifah_32
      DB_PASSWORD: 12345678
      DB_NAME: dbuasfika
      NEXTAUTH_URL: http://18.143.90.3:3000
      NEXTAUTH_SECRET: superrahasiabanget12345678901234
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}